[project]
name = "hexlet-code"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Lunoed", email = "meispandaren@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "black>=26.10.1",
    "flask>=3.1.3",
    "gunicorn>=26.2.0",
    "requests>=2.34.2",
    "ruff>=0.17.1",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["page_analyzer"]

[tool.coverage.report]
fail_under = 80

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[project.scripts] 
page-analyzer = "page_analyzer.app:main"
